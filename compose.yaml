networks:
  isolated:

services:
  hltv:
    image: caddy:2-alpine
    ports:
      - 80:80
    volumes:
      - ./test/hltv-rss.xml:/www/rss/news:ro
    command: caddy file-server --listen :80 --root /www
    networks:
      - isolated

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BOTLIST_ME_CLIENT_TOKEN=${BOTLIST_ME_CLIENT_TOKEN}
      - DECLARE_SLASH_COMMANDS=${DECLARE_SLASH_COMMANDS}
      - DISCORD_BOTS_GG_TOKEN=${DISCORD_BOTS_GG_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_TOKEN=${DISCORD_CLIENT_TOKEN}
      - DISCORD_LIST_CLIENT_TOKEN=${DISCORD_LIST_CLIENT_TOKEN}
      # - TOPGG_CLIENT_TOKEN=${TOPGG_CLIENT_TOKEN}  # Not needed locally
      - HLTV_ENDPOINT=http://hltv:80
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - hltv
    networks:
      - isolated
